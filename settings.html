<!doctype html>
<!--
  FILE: settings.html | FOLDER: project root
  PURPOSE: Compatibility redirect for old Settings bookmarks.
  The real Settings view is rendered inside index.html by pages/home/home.js,
  so this file only forwards the browser to that shared application shell.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=index.html?view=Settings" />
    <title>SariSync Settings</title>
  </head>
  <body>
    <p>Opening Settings…</p>
    <script>window.location.replace('index.html?view=Settings');</script>
  </body>
</html>
